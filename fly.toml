# fly.toml app configuration file generated for pomogator4business-backend on 2026-09-30T08:08:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pomogator4business-backend'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 4096
