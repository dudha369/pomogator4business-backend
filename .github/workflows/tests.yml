name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # та же версия Python и те же пакеты (uv.lock), что и в Docker
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run pytest -q
