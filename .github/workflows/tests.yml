name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # быстрая проверка стиля и ошибок: падает раньше тестов, Postgres не нужен
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      BOT_TOKEN: "123456:TEST"
      WEBHOOK_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # та же версия Python и те же пакеты (uv.lock), что и в Docker
      - run: uv python install 3.11
      - run: uv sync --frozen
      # быстрые тесты на SQLite
      - run: uv run pytest -q
      # те же тесты на Postgres: прод живёт на нём, а не на SQLite
      - run: uv run pytest -q
        env:
          TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
      # миграции: чистая БД -> upgrade -> модели и миграции не расходятся
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ci_migrations"
      - run: |
          uv run aerich upgrade
          out=$(uv run aerich migrate --name ci_check 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "No changes detected"
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/ci_migrations
