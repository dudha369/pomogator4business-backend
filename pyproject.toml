[project]
name = "pomogator4business"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aerich>=0.9.2",
    "aiogram>=3.22.0",
    "asyncpg>=0.31.0",
    "cryptography>=47.0.0",
    "deep-translator>=1.11.4",
    "fastapi>=0.128.8",
    "speechrecognition>=3.10",
    "pillow>=11.3.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "qrcode>=8.2",
    "tomlkit>=0.15.1",
    "tortoise-orm>=1.0",
    "uvicorn>=0.39.0",
]

[project.optional-dependencies]
migration = ["aiosqlite>=0.22.1"]

[tool.aerich]
tortoise_orm = "config.TORTOISE_ORM"
location = "./db/migrations"
src_folder = "./."

[tool.tortoise]
tortoise_orm = "config.TORTOISE_ORM"
location = "db/migrations"
src_folder = "./."
