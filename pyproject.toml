[project]
name = "pomogator4business"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aerich>=0.9.2",
    "aiogram>=3.22.0",
    "asyncpg>=0.31.0",
    "cryptography>=47.0.0",
    "deep-translator>=1.11.4",
    "fastapi>=0.128.8",
    "speechrecognition>=3.10",
    "pillow>=11.3.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "qrcode>=8.2",
    "tomlkit>=0.15.1",
    "tzdata>=2024.1",
    "tortoise-orm==0.25.4",
    "uvicorn>=0.39.0",
    "telethon==1.45.0",
]

[project.optional-dependencies]
migration = ["aiosqlite>=0.22.1"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.17,<0.18",
]

[tool.aerich]
tortoise_orm = "config.TORTOISE_ORM"
location = "./db/migrations"
src_folder = "./."

[tool.tortoise]
tortoise_orm = "config.TORTOISE_ORM"
location = "db/migrations"
src_folder = "./."

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["db/migrations", "generated"]

[tool.ruff.lint]
# Явный набор: результат не зависит от версии ruff.
# E4/E7/E9 + F — ошибки, I — порядок импортов, B — типичные баги, UP — устаревший синтаксис,
# SIM — упрощения, ASYNC — блокирующие вызовы в async, C4 — лишние коллекции, RUF — прочее.
# BLE и S намеренно не включены: широкий `except Exception` — осознанное правило проекта
# (хендлер бота не должен падать, сбой уходит в лог / alerts), а не ошибка.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "ASYNC", "C4", "RUF", "PLC0414"]
# RUF001-003 ищут кириллицу, похожую на латиницу: тексты и комментарии проекта русские, правило не применимо
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# в тестах часто «лишние» аргументы фикстур и неиспользуемые распаковки
"tests/*" = ["RUF059"]

[tool.ruff.lint.flake8-bugbear]
# aiogram/FastAPI: Depends(), Query() и т.п. в значениях по умолчанию — штатный приём
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path"]
